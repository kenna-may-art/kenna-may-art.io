<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Design - Kenna May</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="site-nav">
      <a class="back-link" href="index.html">&larr; KENNA MAY / PORTFOLIO</a>
      <nav class="site-nav-links" aria-label="Primary navigation">
        <a href="index.html#work">WORK</a>
        <a href="index.html#about">ABOUT</a>
        <a href="resume.html">RESUME</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
    </header>

    <main class="container page-main">
      <section class="character-profiles" aria-label="Character design gallery">
        <div class="character-art character-art-caster-final js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 1" data-lightbox-label="Artwork 1" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-caster-concept js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 2" data-lightbox-label="Artwork 2" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-caster-expression js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 3" data-lightbox-label="Artwork 3" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-proto-final js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 4" data-lightbox-label="Artwork 4" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-proto-concept js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 5" data-lightbox-label="Artwork 5" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-proto-expression js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 6" data-lightbox-label="Artwork 6" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-collector-final js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 7" data-lightbox-label="Artwork 7" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-collector-concept js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 8" data-lightbox-label="Artwork 8" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-collector-expression js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 9" data-lightbox-label="Artwork 9" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="image-lightbox" aria-hidden="true">
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="lightbox-head">
        <p class="lightbox-title" id="lightbox-title">Artwork preview</p>
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close preview">CLOSE</button>
      </div>
      <div class="lightbox-media">
        <img id="lightbox-image" src="" alt="Artwork preview" />
      </div>
    </div>
  </div>

  <script src="lightbox.js"></script>
</body>
</html>
