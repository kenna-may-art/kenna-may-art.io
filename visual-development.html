<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Development - Kenna May</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="site-nav">
      <a class="back-link" href="index.html">&larr; KENNA MAY / PORTFOLIO</a>
      <nav class="site-nav-links" aria-label="Primary navigation">
        <a href="index.html#work">WORK</a>
        <a href="index.html#about">ABOUT</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
    </header>

    <main class="container page-main">
      <section class="character-profiles" aria-label="Character design gallery">
        <div class="character-art character-art-caster-final js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 1" data-lightbox-label="Artwork 1" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-ash-cog js-lightbox-trigger" role="img" tabindex="0" aria-label="Ash and Cog environment artwork" data-lightbox-label="Ash and Cog environment" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-bg-shop js-lightbox-trigger" role="img" tabindex="0" aria-label="Shop environment artwork" data-lightbox-label="Shop environment" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-walk js-lightbox-trigger" role="img" tabindex="0" aria-label="Walk environment artwork" data-lightbox-label="Walk environment" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-room-v1 js-lightbox-trigger" role="img" tabindex="0" aria-label="Room environment artwork version 1" data-lightbox-label="Room environment v1" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-room-v2 js-lightbox-trigger" role="img" tabindex="0" aria-label="Room environment artwork version 2" data-lightbox-label="Room environment v2" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-dream js-lightbox-trigger" role="img" tabindex="0" aria-label="Dream sequence environment artwork" data-lightbox-label="Dream sequence environment" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-menu-highlight js-lightbox-trigger" role="img" tabindex="0" aria-label="Menu highlight artwork" data-lightbox-label="Menu highlight" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-card-layout js-lightbox-trigger" role="img" tabindex="0" aria-label="Card layout artwork" data-lightbox-label="Card layout" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-card-covers js-lightbox-trigger" role="img" tabindex="0" aria-label="Card layout covers artwork" data-lightbox-label="Card layout covers" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-collector-final js-lightbox-trigger" role="img" tabindex="0" aria-label="Collector design artwork" data-lightbox-label="Collector design" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-final-sprite js-lightbox-trigger" role="img" tabindex="0" aria-label="Final sprite artwork" data-lightbox-label="Final sprite" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-c3 js-lightbox-trigger" role="img" tabindex="0" aria-label="C3 artwork" data-lightbox-label="C3" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-mhcaster js-lightbox-trigger" role="img" tabindex="0" aria-label="Mechanical Heart caster artwork" data-lightbox-label="Mechanical Heart caster" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-flyer js-lightbox-trigger" role="img" tabindex="0" aria-label="Flyer artwork" data-lightbox-label="Flyer" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-heart-redline js-lightbox-trigger" role="img" tabindex="0" aria-label="Heart redline artwork" data-lightbox-label="Heart redline" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-dreamp1 js-lightbox-trigger" role="img" tabindex="0" aria-label="Dream artwork" data-lightbox-label="Dream" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-mechanical-thumbnail js-lightbox-trigger" role="img" tabindex="0" aria-label="Mechanical Heart thumbnail artwork" data-lightbox-label="Mechanical Heart thumbnail" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art visual-art-proto-head-tilt js-lightbox-trigger" role="img" tabindex="0" aria-label="Proto head tilt artwork" data-lightbox-label="Proto head tilt" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
        <div class="character-art character-art-collector-concept js-lightbox-trigger" role="img" tabindex="0" aria-label="Character design artwork 8" data-lightbox-label="Artwork 8" data-lightbox-navigation="layout" data-lightbox-group="character-gallery"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="image-lightbox" aria-hidden="true">
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="lightbox-head">
        <p class="lightbox-title" id="lightbox-title">Artwork preview</p>
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close preview">CLOSE</button>
      </div>
      <div class="lightbox-media">
        <img id="lightbox-image" src="" alt="Artwork preview" />
      </div>
    </div>
  </div>

  <script src="lightbox.js"></script>
</body>
</html>
